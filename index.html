<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Alchemy - 知識のクエスト -</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Kiwi+Maru:wght@500;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        /* 全体スタイル */
        body {
            margin: 0; padding: 0;
            background-color: #111a24;
            background-image:
                radial-gradient(circle at 30% 30%, rgba(78, 204, 163, 0.08) 0%, transparent 50%),
                linear-gradient(180deg, #0f171e 0%, #1b2836 100%);
            font-family: 'Kiwi Maru', serif;
            overflow: hidden;
            color: #e9e9eb;
        }
        /* コマンドウィンドウ */
        .game-window {
            background: #ffffff; border: 4px solid #333333; border-radius: 12px;
            box-shadow: 6px 6px 0px #111111; padding: 18px; position: absolute; z-index: 10; color: #111111;
        }
        #command-window { top: 20px; left: 20px; width: 330px; }
        .word-label { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
        .word-input {
            background: #f1f2f6; border: 3px solid #333333; border-radius: 6px;
            color: #111111; font-family: 'Kiwi Maru', serif; font-size: 16px; width: 88%; padding: 8px; margin-bottom: 12px; outline: none;
        }
        /* 実行ボタン */
        .mix-btn {
            background: #4ecca3; border: 3px solid #333333; color: #111111;
            font-family: 'DotGothic16', sans-serif; font-size: 18px; font-weight: bold; padding: 10px 20px;
            cursor: pointer; border-radius: 6px; width: 100%; box-shadow: 4px 4px 0px #2c3e50;
        }
        .mix-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #2c3e50; }
        .mix-btn:disabled { background: #bdc3c7; cursor: not-allowed; box-shadow: 4px 4px 0px #7f8c8d; }

        /* 対話UIエリア */
        #dialogue-area {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 75%; display: flex; align-items: flex-end; z-index: 10;
        }
        #char-container { text-align: center; margin-right: 20px; min-width: 110px; }
        #char-avatar { font-size: 70px; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.3)); }
        #char-name {
            background: #333333; color: #ffffff; font-size: 14px; font-weight: bold;
            padding: 4px 10px; border-radius: 4px; margin-top: 5px; display: inline-block;
            font-family: 'DotGothic16', sans-serif;
        }
        /* 吹き出し */
        .speech-bubble {
            flex-grow: 1; background: #ffffff; border: 4px solid #333333; border-radius: 16px;
            padding: 20px 25px; color: #111111; font-size: 20px; line-height: 1.8; font-weight: 700;
            position: relative; box-shadow: 6px 6px 0px #111111; cursor: pointer; min-height: 70px;
        }
        .speech-bubble:active { transform: translate(1px, 1px); }
        .speech-bubble::before { content: ''; position: absolute; left: -22px; bottom: 25px; border-width: 10px 18px 10px 0; border-style: solid; border-color: transparent #333333 transparent transparent; }
        .speech-bubble::after { content: ''; position: absolute; left: -15px; bottom: 27px; border-width: 8px 16px 8px 0; border-style: solid; border-color: transparent #ffffff transparent transparent; }

        /* アンケートボタン */
        .survey-btn {
            background: #fbc531; border: 3px solid #333333; color: #111111;
            font-family: 'Kiwi Maru', serif; font-size: 16px; font-weight: bold; padding: 10px 15px;
            cursor: pointer; border-radius: 8px; margin: 5px; box-shadow: 4px 4px 0px #2c3e50;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .survey-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #2c3e50; }

        /* ルビ・強調テキスト */
        ruby { ruby-align: center; }
        rt { font-size: 0.55em; color: #555; font-weight: 500; transform: translateY(-2px); }
        .score-highlight { color: #e74c3c; font-size: 1.2em; font-family: 'DotGothic16', sans-serif; }
        #tap-indicator { position: absolute; right: 20px; bottom: 15px; color: #e74c3c; font-size: 22px; animation: blink 0.8s infinite; display: none; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* グラフ描画領域 */
        #mynetwork { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 詳細ポップアップ */
        #seed-popup {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; background: #fffdf4; border: 5px solid #333333; border-radius: 16px;
            box-shadow: 10px 10px 0px #111111; z-index: 100; padding: 30px; text-align: center; color: #111111;
        }
        #cover-container { min-height: 140px; display: flex; justify-content: center; align-items: center; margin: 10px 0; }
        #seed-emoji { font-size: 60px; animation: float 1.5s infinite ease-in-out alternate; }
        @keyframes float { from { transform: translateY(0); } to { transform: translateY(-8px); } }
        #book-cover-img { max-height: 160px; display: none; border-radius: 8px; border: 3px solid #333; box-shadow: 4px 4px 0px #333; }

        /* ポップアップ内テキスト調整 */
        #award-book-title { font-size: 22px !important; }
        #award-score { font-size: 20px !important; }
        #popup-desc { font-size: 18px !important; line-height: 1.8 !important; }
    </style>
</head>
<body>
    <div id="command-window" class="game-window">
        <div class="word-label">🧪 1つめの言葉:</div>
        <input type="text" id="in-word1" class="word-input" value="星占い">
        <div class="word-label">🧪 2つめの言葉:</div>
        <input type="text" id="in-word2" class="word-input" value="ロケット">
        <button id="btn-mix" class="mix-btn" onclick="startAdventure()">まぜあわせる！</button>
    </div>
    <div id="dialogue-area">
        <div id="char-container">
            <div id="char-avatar">🦉</div>
            <div id="char-name">大図書館の長</div>
        </div>
        <div class="speech-bubble" onclick="onBubbleTap()">
            <span id="msg-text-content"></span>
            <div id="survey-container" style="display: none; margin-top: 15px; text-align: center;">
                <button class="survey-btn" onclick="sendFeedback(event, '💡新しい発見があった！')">💡 新しい発見があった！</button>
                <button class="survey-btn" onclick="sendFeedback(event, '🔍もっと探したい！')">🔍 もっと探したい！</button>
                <button class="survey-btn" onclick="sendFeedback(event, '💦むずかしかった')">💦 むずかしかった</button>
            </div>
            <div id="tap-indicator">▼</div>
        </div>
    </div>
    <div id="mynetwork"></div>
    <div id="seed-popup">
        <h2 style="font-family:'DotGothic16'; color:#27ae60; margin-top:0; font-size:26px;">🌱 知識の種をゲット！</h2>
        <div id="cover-container">
            <div id="seed-emoji">🌰</div>
            <img id="book-cover-img" src="" alt="本の表紙">
        </div>
        <p style="font-weight:bold; margin:10px 0;" id="award-book-title"></p>
        <p style="font-family:'DotGothic16'; color:#e74c3c; margin-top:0;" id="award-score"></p>
        <div id="popup-desc" style="text-align:left; background:#f1f2f6; padding:15px; border:3px solid #333333; border-radius:8px; font-weight:bold;">
            君の<ruby>頭<rt>あたま</rt></ruby>の中で見つけたこの「<ruby>知識<rt>ちしき</rt></ruby>の種」は、まだ眠っている<ruby>状態<rt>じょうたい</rt></ruby>だよ。<br><br>
            <strong><ruby>町<rt>まち</rt></ruby>の図書館に行ってこの本をひらくことで、君の<ruby>知識<rt>ちしき</rt></ruby>の<ruby>芽<rt>め</rt></ruby>がパッと咲くんだ！</strong>
        </div>
        <p style="font-size:13px; color:#e74c3c; font-weight:bold; margin-top:15px;">📸 この画面のスクショをとって図書館へ冒険にいこう！</p>
        <button class="mix-btn" style="width:60%; margin-top:10px;" onclick="closePopup()">とじる</button>
    </div>

    <script type="text/javascript">
        /*
         * プロトタイプUI実装
         * ※ 本ファイルはUI/UX検証用プロトタイプであり、SBERT等のAI推論ロジックはバックエンドで処理される前提のモック実装である。
         * ※ 主にvis.jsによるグラフ描画、OpenBD APIによる書影取得、インシステムログ収集UIの検証を目的とする。
         */

        // vis.js データセットおよびインスタンス
        let nodesDataset = new vis.DataSet([]);
        let edgesDataset = new vis.DataSet([]);
        let network = null;

        // UI制御用フラグおよび変数
        let eventQueue = [];
        let isTyping = false;
        let isWaitingForTap = false;
        let currentTokens = [];
        let currentFullHtml = "";
        let typeInterval;

        let sessionW1 = "";
        let sessionW2 = "";
        let sessionBookTitle = "";

        // ルビを簡単に書けるように、{漢字|よみ} を <ruby>形式に変換する仕組み
        function tokenizeText(text) {
            const tokens = [];
            let i = 0;
            while (i < text.length) {
                if (text[i] === '{') {
                    let end = text.indexOf('}', i);
                    if (end !== -1) {
                        let inner = text.substring(i + 1, end);
                        let parts = inner.split('|');
                        tokens.push(`<ruby>${parts[0]}<rt>${parts[1]}</rt></ruby>`);
                        i = end + 1; continue;
                    }
                }
                else if (text.substring(i, i+4) === '<br>') {
                    tokens.push('<br>'); i += 4; continue;
                } else if (text.substring(i, i+26) === '<span class="score-highlight">') {
                    tokens.push('<span class="score-highlight">'); i += 30; continue;
                } else if (text.substring(i, i+7) === '</span>') {
                    tokens.push('</span>'); i += 7; continue;
                }
                tokens.push(text[i]); i++;
            }
            return tokens;
        }

        // タイプライター風テキストアニメーションの実行
        function playDialogue(text) {
            isTyping = true; isWaitingForTap = false;
            document.getElementById('tap-indicator').style.display = 'none';
            const el = document.getElementById('msg-text-content');
            el.innerHTML = "";
            currentTokens = tokenizeText(text);
            currentFullHtml = currentTokens.join('');
            let i = 0;
            typeInterval = setInterval(() => {
                if (i < currentTokens.length) {
                    el.innerHTML += currentTokens[i]; i++;
                } else {
                    finishTyping();
                }
            }, 50);
        }

        // テキストアニメーションの強制終了・全表示
        function finishTyping() {
            clearInterval(typeInterval);
            document.getElementById('msg-text-content').innerHTML = currentFullHtml;
            isTyping = false; isWaitingForTap = true;
            document.getElementById('tap-indicator').style.display = 'block';
        }

        // 吹き出しタップ時のイベントハンドラ
        function onBubbleTap() {
            if (isTyping) finishTyping();
            else if (isWaitingForTap) nextEvent();
        }

        // イベントキューの進行
        function nextEvent() {
            if (eventQueue.length > 0) eventQueue.shift()();
        }

        // キャラクターアイコン・名前の更新
        function changeChar(avatar, name) {
            document.getElementById('char-avatar').innerText = avatar;
            document.getElementById('char-name').innerText = name;
        }

        // vis.jsネットワークの初期化および初期イベント実行
        function initMap() {
            const container = document.getElementById('mynetwork');
            network = new vis.Network(container, { nodes: nodesDataset, edges: edgesDataset }, {
                nodes: { font: { face: 'Kiwi Maru', color: '#ffffff', size: 18 }, borderWidth: 3, shadow: true },
                edges: { color: { color: '#4ecca3' }, width: 3 },
                physics: { enabled: true, solver: 'repulsion' }
            });

            eventQueue = [
                () => playDialogue(`ここは君の{頭|あたま}の中にある「{言葉|ことば}のまほう図書館」だよ。`),
                () => playDialogue(`気になる{言葉|ことば}を２つ入れて、「まぜあわせる」ボタンをおしてね！`)
            ];
            nextEvent();
        }

        // 検索実行時のモック処理とネットワークグラフ更新
        function startAdventure() {
            sessionW1 = document.getElementById('in-word1').value;
            sessionW2 = document.getElementById('in-word2').value;
            document.getElementById('btn-mix').disabled = true;

            // 既存ノード・エッジのクリア
            nodesDataset.clear(); edgesDataset.clear();

            // 推薦結果のモックデータ
            const targetShelfName = "【4類：自然科学の棚】";
            const npcAvatar = "🦖"; const npcName = "かがくの精霊";
            const bookTitle = "『小学館の図鑑NEO 宇宙』(請求記号: 440)";
            sessionBookTitle = bookTitle;
            const bookIsbn = "9784092172198";
            const pittariScore = 85;

            // eventQueueに処理を登録し、結果のモック表示を行う処理
            eventQueue = [
                () => {
                    changeChar("🧪", "大図書館の長");
                    playDialogue(`おもしろいね！<br>『${sessionW1}』と『${sessionW2}』の{言葉|ことば}を{混|ま}ぜ合わせてみるよ！`);
                },
                () => playDialogue(`（シュワシュワ…{頭|あたま}の中の{本棚|ほんだな}を{探|さが}しているよ…）`),
                () => {
                    // 入力単語ノード追加
                    nodesDataset.add({ id: 'w1', label: sessionW1, shape: 'circle', color: '#fbc531', font: {color: '#111', size: 18} });
                    nodesDataset.add({ id: 'w2', label: sessionW2, shape: 'circle', color: '#00a8ff', font: {color: '#111', size: 18} });
                    changeChar(npcAvatar, npcName);
                    playDialogue(`ハロー！よくきたね！<br>君は今、${targetShelfName}にいるよ。`);
                },
                () => {
                    // カテゴリ（棚）ノード追加
                    nodesDataset.add({ id: 'shelf', label: `📚\n${targetShelfName}`, shape: 'box', color: "#4cd137", font: {size: 20} });
                    edgesDataset.add({ from: 'w1', to: 'shelf', length: 250 });
                    edgesDataset.add({ from: 'w2', to: 'shelf', length: 250 });
                    playDialogue(`君が{作|つく}った{言葉|ことば}のエネルギーが、この棚に届いたんだ！`);
                },
                () => playDialogue(`きみの２つの{言葉|ことば}から見つかった本の【ぴったり度】は <span class="score-highlight">${pittariScore}点</span> だ！`),
                () => playDialogue(`見つけ出した本は。。。これだ！`),
                () => {
                    // 推薦図書ノード追加
                    nodesDataset.add({
                        id: 'book', label: `📘 ${bookTitle}\n(ぴったり度: ${pittariScore}点)`, shape: 'box', size: 50,
                        color: { background: '#ffffff', border: "#4cd137" }, font: {size: 20, bold: true, color: '#111'}
                    });
                    edgesDataset.add({ from: 'shelf', to: 'book', width: 8, color: '#e84118', length: 150 });

                    playDialogue(`この本を読むと【{宇宙|うちゅう}の科学】に{詳|くわ}しくなれるんだ。<br>さあ、画面に出た本をタップしてみて！`);

                    // ノードクリック時の詳細ポップアップ表示処理
                    network.on("click", async function(params) {
                        if(params.nodes[0] === 'book') {
                            document.getElementById('award-book-title').innerText = bookTitle;
                            document.getElementById('award-score').innerText = `✨ ぴったり度: ${pittariScore}点 ✨`;

                            const imgEl = document.getElementById('book-cover-img');
                            const emojiEl = document.getElementById('seed-emoji');

                            // 画像ローディング制御
                            imgEl.style.display = 'none';
                            emojiEl.style.display = 'block';

                            try {
                                // OpenBD API から書影画像を取得する処理
                                const response = await fetch(`https://api.openbd.jp/v1/get?isbn=${bookIsbn}`);
                                const data = await response.json();

                                if (data && data[0] && data[0].summary && data[0].summary.cover) {
                                    imgEl.src = data[0].summary.cover;
                                    imgEl.style.display = 'block';
                                    emojiEl.style.display = 'none';
                                }
                            } catch(e) {
                                console.log("画像取得スキップ");
                            }
                            document.getElementById('seed-popup').style.display = 'block';
                        }
                    });
                }
            ];
            nextEvent();
        }

        // ポップアップを閉じた後にアンケートUIへ移動する操作
        function closePopup() {
            document.getElementById('seed-popup').style.display = 'none';
            eventQueue = [
                () => {
                    changeChar("🦉", "大図書館の長");
                    playDialogue(`見つけた本はどうだった？<br>今の君の【気持ち】を教えてね！`);
                },
                () => {
                    document.getElementById('tap-indicator').style.display = 'none';
                    isWaitingForTap = false;
                    document.getElementById('survey-container').style.display = 'block';
                }
            ];
            nextEvent();
        }

        // アンケート結果（ログ）の送信処理（モック）
        function sendFeedback(event, answer) {
            event.stopPropagation();
            document.getElementById('survey-container').style.display = 'none';

            const logData = {
                timestamp: new Date().toISOString(),
                word1: sessionW1,
                word2: sessionW2,
                bookFound: sessionBookTitle,
                childFeeling: answer
            };
            console.log("📊 【調査ログ取得成功】", logData);

            eventQueue = [
                () => { playDialogue(`教えてくれてありがとう！<br>君の「${answer}」って気持ち、しっかりメモしたよ！`); },
                () => { playDialogue(`さあ、次はどんな{言葉|ことば}をまぜあわせる？<br>冒険はまだまだ続くよ！`); document.getElementById('btn-mix').disabled = false; }
            ];
            nextEvent();
        }

        window.onload = initMap;
    </script>
</body>
</html>
